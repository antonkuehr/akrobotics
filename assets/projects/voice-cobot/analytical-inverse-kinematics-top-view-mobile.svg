<svg xmlns="http://www.w3.org/2000/svg" width="320" height="310" viewBox="0 0 320 310" role="img" aria-labelledby="title desc"><title id="title">Top view — base rotation</title><desc id="desc">Same horizontal construction, x/y axes and base angle delta as the report, arranged for phone-width labels.</desc><style>svg{--ink:#071c17;--paper:#c9d9cc;--sage:#a6bcad;--green:#285f4c;--edge:#285f4c;font-family:Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.035em;color:var(--ink)}
text{fill:var(--ink);font-size:18px} .small{font-size:15px}.heading{font-size:18px;font-weight:700;letter-spacing:.035em}.component{fill:var(--paper);stroke:var(--green);stroke-width:1.2}.pin,.illustration{fill:none;stroke:var(--ink);stroke-width:1.3}.node-title{font-size:18px;font-weight:600}.signal,.camera-flow{fill:none;stroke:var(--ink);stroke-width:1.6;marker-end:url(#arrow)}.tof-flow{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:7 4;marker-end:url(#green-arrow)}.power12{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:9 4;marker-end:url(#green-arrow)}.power5{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:1 5;stroke-linecap:round;marker-end:url(#green-arrow)}.optical{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4;marker-end:url(#green-arrow)}.guide{fill:none;stroke:#577767;stroke-width:.75;stroke-dasharray:4 5}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.reach{fill:none;stroke:var(--green);stroke-width:1;stroke-dasharray:6 4}.dimension{fill:none;stroke:var(--green);stroke-width:1;marker-start:url(#dimension);marker-end:url(#dimension)}.angle{fill:none;stroke:#8d3f23;stroke-width:1.8}.joint{fill:#365b87;stroke:#173c30;stroke-width:1.3}.target{fill:var(--green);stroke:var(--ink);stroke-width:1}.math{font-family:Georgia,serif;font-style:italic;font-size:25px}.axis{fill:none;stroke:var(--ink);stroke-width:1.2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#071c17"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#285f4c"/></marker><marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#285f4c"/></marker></defs><rect width="320" height="310" fill="#a6bcad"/><text x="160" y="25" class="heading" text-anchor="middle">Top view — base rotation</text><path d="M45 240 H280 M45 240 V45" class="axis"/><path d="M45 65 H215 V240" class="guide"/><path d="M45 240 L215 65" class="reach"/><path d="M45 188 A52 52 0 0 1 83 204" class="angle"/><circle cx="45" cy="240" r="5" class="joint"/><circle cx="215" cy="65" r="5" class="target"/><path d="M215 65 l12 -19 M221 41 l16 11" class="link"/><text x="284" y="265" class="math" text-anchor="middle">x</text><text x="23" y="53" class="math" text-anchor="middle">y</text><text x="258" y="99" class="" text-anchor="middle">(x, y)</text><text x="57" y="285" class="" text-anchor="middle">(0, 0)</text><text x="84" y="188" class="math" text-anchor="middle"><tspan fill="#8d3f23">δ</tspan></text><text x="151" y="164" class="math" text-anchor="middle">a</text></svg>