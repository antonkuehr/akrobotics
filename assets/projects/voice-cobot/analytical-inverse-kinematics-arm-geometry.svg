<svg xmlns="http://www.w3.org/2000/svg" width="710" height="400" viewBox="0 0 710 400" role="img" aria-labelledby="title desc"><title id="title">Side view — articulated arm geometry</title><desc id="desc">Shoulder, elbow, wrist and gripper with link length l_AG; auxiliary base-to-wrist distance b, horizontal reach a, height c, and shoulder alpha, elbow beta and wrist gamma angles.</desc><style>svg{--ink:#071c17;--paper:#c9d9cc;--sage:#a6bcad;--green:#285f4c;--edge:#285f4c;font-family:Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.035em;color:var(--ink)}
text{fill:var(--ink);font-size:18px} .small{font-size:15px}.heading{font-size:18px;font-weight:400;letter-spacing:.035em}.component{fill:var(--paper);stroke:var(--green);stroke-width:1.2}.pin,.illustration{fill:none;stroke:var(--ink);stroke-width:1.3}.node-title{font-size:18px;font-weight:600}.signal,.camera-flow{fill:none;stroke:var(--ink);stroke-width:1.6;marker-end:url(#arrow)}.tof-flow{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:7 4;marker-end:url(#green-arrow)}.power12{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:9 4;marker-end:url(#green-arrow)}.power5{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:1 5;stroke-linecap:round;marker-end:url(#green-arrow)}.optical{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4;marker-end:url(#green-arrow)}.guide{fill:none;stroke:#577767;stroke-width:.75;stroke-dasharray:4 5}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.reach{fill:none;stroke:var(--green);stroke-width:1;stroke-dasharray:6 4}.dimension{fill:none;stroke:var(--green);stroke-width:1;marker-start:url(#dimension);marker-end:url(#dimension)}.angle{fill:none;stroke:#8d3f23;stroke-width:1.8}.joint{fill:#365b87;stroke:#173c30;stroke-width:1.3}.target{fill:var(--green);stroke:var(--ink);stroke-width:1}.math{font-family:Georgia,serif;font-style:italic;font-size:25px}.axis{fill:none;stroke:var(--ink);stroke-width:1.2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#071c17"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#285f4c"/></marker><marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#285f4c"/></marker></defs><rect width="710" height="400" fill="#a6bcad"/><text x="350" y="26" class="heading" text-anchor="middle">Side view — arm geometry</text><path d="M110 300 V50 M110 300 H590 M590 190 V300 M270 75 L311 254 M270 75 L420 225 M590 190 L665 218 M270 75 L318 8" class="guide"/><path d="M110 300 L590 190" class="reach"/><path d="M110 300 L270 75 L590 190 L590 300" class="link"/><path d="M110 235 A65 65 0 0 1 150 247 M309 87 A45 45 0 0 1 305 116 M639 209 A53 53 0 0 1 591 246" class="angle"/><path d="M295 258 l-4 -17 l17 -4" class="angle"/><path d="M650 190 V300" class="dimension"/><path d="M635 190 H666 M635 300 H666" class="pin"/><path d="M110 327 H590" class="dimension"/><path d="M552 300 H616 M616 291 V309" class="link"/><circle cx="110" cy="300" r="6" class="joint"/><circle cx="270" cy="75" r="6" class="joint"/><circle cx="590" cy="190" r="6" class="joint"/><circle cx="590" cy="300" r="6" class="target"/><text x="147" y="229" class="math" text-anchor="middle"><tspan fill="#8d3f23">α</tspan></text><text x="353" y="139" class="math" text-anchor="middle"><tspan fill="#8d3f23">β</tspan></text><text x="627" y="253" class="math" text-anchor="middle"><tspan fill="#8d3f23">γ</tspan></text><text x="355" y="224" class="math" text-anchor="middle">b</text><text x="350" y="354" class="math" text-anchor="middle">a</text><text x="673" y="254" class="math" text-anchor="middle">c</text><text x="178" y="159" class="math" text-anchor="middle">ℓ<tspan baseline-shift="sub" font-size="16">AG</tspan></text><text x="120" y="382" class="" text-anchor="middle">Shoulder / base</text><text x="263" y="58" class="" text-anchor="middle">Elbow</text><text x="565" y="173" class="" text-anchor="middle">Wrist</text><text x="553" y="382" class="" text-anchor="middle">Gripper / target</text><g aria-label="y-z coordinate frame"><rect x="598" y="45" width="82" height="115" rx="5" fill="#c9d9cc" stroke="#527363" stroke-width=".7"/><path d="M658 132 H620 M658 132 V87" class="axis"/><text x="618" y="150" class="math">y</text><text x="658" y="81" class="math">z</text></g></svg>