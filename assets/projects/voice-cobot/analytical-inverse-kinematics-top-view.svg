<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-labelledby="title desc"><title id="title">Top view — base rotation</title><desc id="desc">Coordinate axes x and y, target (x,y), horizontal distance a, and base angle delta measured from the y axis. Dashed lines project the target onto both axes.</desc><style>svg{--ink:#071c17;--paper:#c9d9cc;--sage:#b8cbbd;--green:#285f4c;--edge:#285f4c;font-family:Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.035em;color:var(--ink)}
