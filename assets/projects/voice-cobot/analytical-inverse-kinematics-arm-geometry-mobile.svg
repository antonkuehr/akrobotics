<svg xmlns="http://www.w3.org/2000/svg" width="320" height="375" viewBox="0 0 320 375" role="img" aria-labelledby="title desc"><title id="title">Side view — articulated arm geometry</title><desc id="desc">Phone-width version with shoulder, elbow, wrist, gripper, link length, alpha/beta/gamma angles, auxiliary construction lines and dimensions a/b/c.</desc><style>svg{--ink:#071c17;--paper:#c9d9cc;--sage:#b8cbbd;--green:#285f4c;--edge:#285f4c;font-family:Aptos,"Segoe UI",Arial,sans-serif;letter-spacing:.035em;color:var(--ink)}
text{fill:var(--ink);font-size:18px} .small{font-size:15px}.heading{font-size:18px;font-weight:400;letter-spacing:.035em}.component{fill:var(--paper);stroke:var(--green);stroke-width:1.2}.pin,.illustration{fill:none;stroke:var(--ink);stroke-width:1.3}.node-title{font-size:18px;font-weight:600}.signal,.camera-flow{fill:none;stroke:var(--ink);stroke-width:1.6;marker-end:url(#arrow)}.tof-flow{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:7 4;marker-end:url(#green-arrow)}.power12{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:9 4;marker-end:url(#green-arrow)}.power5{fill:none;stroke:var(--green);stroke-width:1.5;stroke-dasharray:1 5;stroke-linecap:round;marker-end:url(#green-arrow)}.optical{fill:none;stroke:var(--green);stroke-width:1.2;stroke-dasharray:3 4;marker-end:url(#green-arrow)}.guide{fill:none;stroke:#577767;stroke-width:.75;stroke-dasharray:4 5}.link{fill:none;stroke:var(--ink);stroke-width:2.5}.reach{fill:none;stroke:var(--green);stroke-width:1;stroke-dasharray:6 4}.dimension{fill:none;stroke:var(--green);stroke-width:1;marker-start:url(#dimension);marker-end:url(#dimension)}.angle{fill:none;stroke:#8d3f23;stroke-width:1.8}.joint{fill:#365b87;stroke:#173c30;stroke-width:1.3}.target{fill:var(--green);stroke:var(--ink);stroke-width:1}.math{font-family:Georgia,serif;font-style:italic;font-size:25px}.axis{fill:none;stroke:var(--ink);stroke-width:1.2;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#071c17"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#285f4c"/></marker><marker id="dimension" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 0 0 3 6 6" fill="none" stroke="#285f4c"/></marker></defs><rect width="320" height="375" fill="#b8cbbd"/><text x="160" y="25" class="heading" text-anchor="middle">Side view — arm geometry</text><path d="M45 270 V50 M45 270 H255 M255 150 V270 M110 65 L182 192 M110 65 L220 200 M255 150 L307 180 M110 65 L125 18" class="guide"/><path d="M45 270 L255 150" class="reach"/><path d="M45 270 L110 65 L255 150 L255 270" class="link"/><path d="M45 228 A42 42 0 0 1 59 229 M143 85 A36 36 0 0 1 133 94 M290 171 A42 42 0 0 1 255 205" class="angle"/><path d="M300 150 V270" class="dimension"/><path d="M287 150 H307 M287 270 H307" class="pin"/><path d="M45 300 H255" class="dimension"/><path d="M231 270 H272 M272 263 V277" class="link"/><circle cx="45" cy="270" r="5" class="joint"/><circle cx="110" cy="65" r="5" class="joint"/><circle cx="255" cy="150" r="5" class="joint"/><circle cx="255" cy="270" r="5" class="target"/><text x="68" y="219" class="math" text-anchor="middle"><tspan fill="#8d3f23">α</tspan></text><text x="165" y="120" class="math" text-anchor="middle"><tspan fill="#8d3f23">β</tspan></text><text x="276" y="201" class="math" text-anchor="middle"><tspan fill="#8d3f23">γ</tspan></text><text x="158" y="231" class="math" text-anchor="middle">b</text><text x="150" y="326" class="math" text-anchor="middle">a</text><text x="303" y="230" class="math" text-anchor="middle">c</text><text x="75" y="147" class="math" text-anchor="middle">ℓ<tspan baseline-shift="sub" font-size="16">AG</tspan></text><text x="108" y="52" class="" text-anchor="middle">Elbow</text><text x="205" y="140" class="" text-anchor="middle">Wrist</text><text x="73" y="356" class="small" text-anchor="middle">Shoulder / base</text><text x="242" y="356" class="small" text-anchor="middle">Gripper / target</text><g aria-label="y-z coordinate frame"><rect x="238" y="37" width="72" height="91" rx="5" fill="#c9d9cc" stroke="#527363" stroke-width=".7"/><path d="M291 106 H253 M291 106 V61" class="axis"/><text x="251" y="124" class="math">y</text><text x="291" y="55" class="math">z</text></g></svg>