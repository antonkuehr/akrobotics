<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 590" role="img" aria-labelledby="title description">
<title id="title">Activation pressure by separator fill density</title>
<desc id="description">English redraw of the supplied result plot. Curves are traced from the source image, rather than new measurements. Activation pressure increases with fill density; the 3 mm separator needs more pressure than the 2 mm separator.</desc>
<style>text{font-family:Aptos,Segoe UI,Arial,sans-serif;fill:#f1f8f4;font-size:20px}.grid{stroke:#4f9275;stroke-dasharray:7 7;stroke-width:1}.axis{stroke:#c9ddd4;stroke-width:1.5}.thin{fill:none;stroke-width:2.5}.blue{stroke:#68b5ff}.red{stroke:#ff8b79}</style>
<g class="grid"><path d="M100 73H595M100 150H595M100 226H595M100 302H595M100 378H595"/></g>
<path class="axis" fill="none" d="M100 31H595V444H100Z"/>
<g text-anchor="end"><text x="88" y="80">100</text><text x="88" y="157">80</text><text x="88" y="233">60</text><text x="88" y="309">40</text><text x="88" y="385">20</text></g>
<g text-anchor="middle"><text x="140" y="476">10%</text><text x="278" y="476">15%</text><text x="415" y="476">20%</text><text x="553" y="476">25%</text><text x="347" y="512">Fill density</text></g>
<text transform="translate(29 240) rotate(-90)" text-anchor="middle">Activation pressure (Pa)</text>
<path class="thin blue" d="M140 408L278 321L415 245L553 172"/><path class="thin red" d="M140 321L278 260L415 158L553 66"/>
<g fill="#68b5ff"><circle cx="140" cy="408" r="4"/><circle cx="278" cy="321" r="4"/><circle cx="415" cy="245" r="4"/><circle cx="553" cy="172" r="4"/></g>
<g fill="#ff8b79"><circle cx="140" cy="321" r="4"/><circle cx="278" cy="260" r="4"/><circle cx="415" cy="158" r="4"/><circle cx="553" cy="66" r="4"/></g>
<path class="thin blue" d="M95 553H137"/><text x="148" y="560">2 mm separator</text><path class="thin red" d="M365 553H407"/><text x="418" y="560">3 mm separator</text>
</svg>